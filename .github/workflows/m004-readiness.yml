name: M004 hardware readiness only - no neural qualification
on:
  push:
    branches: [codex/studio-ia-m004-neural-local]
permissions:
  contents: read
jobs:
  readiness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      STUDIO_IA_HOME: ${{ github.workspace }}/artifacts/state
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Collect actual readiness, require no inference or permission promotion
        shell: python
        run: |
          import json, subprocess
          from pathlib import Path
          result = subprocess.run(['python', 'scripts/qualify_neural.py', '--output', 'artifacts/m004-readiness'], check=False)
          report = json.loads(Path('artifacts/m004-readiness/nn-e2e-001.json').read_text())
          assert result.returncode == 2 and report['status'] == 'BLOCKED'
          assert report['m005_allowed'] is False
          assert report['tests']['passed'] == 0
          print('READINESS_COLLECTED; NEURAL_E2E_BLOCKED; M005_NO_GO')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m004-readiness-${{ runner.os }}-${{ github.sha }}
          path: artifacts/m004-readiness/
          retention-days: 90
