name: Temporary M005 Ruff exact-diff diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  ruff-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned formatter
        run: python -m pip install ruff==0.11.13
      - name: Show exact Ruff diff
        run: python -m ruff format --diff src/studio_ia/temporal.py tests/test_temporal_m005.py
