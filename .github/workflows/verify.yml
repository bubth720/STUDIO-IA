name: M003 real CPU, Qt and experimental desktop builds

on:
  push:
    branches: ['codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    name: CPU + Qt + package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      STUDIO_IA_HOME: ${{ github.workspace }}/artifacts/state
      STUDIO_IA_TEMPORAL_GUI_EVIDENCE: ${{ github.workspace }}/artifacts/temporal-gui
      STUDIO_IA_GUI_EVIDENCE: ${{ github.workspace }}/artifacts/gui
      STUDIO_IA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.STUDIO_IA_SOURCE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Linux media and display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb libegl1 libgl1 libdbus-1-3 libfontconfig1 fonts-dejavu-core libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-xinerama0
      - name: Windows FFmpeg (external, not redistributed)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --version=7.1.1 -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Command ffmpeg, ffprobe
      - name: Pinned Python project dependencies
        run: |
          python -m pip install pip==26.3
          python -m pip install -e ".[dev,gui,build]"
      - name: Lint and core types
        run: |
          python -m ruff check src tests scripts quality ui
          python -m ruff format --check src tests scripts quality ui
          python -m mypy src/studio_ia/core.py src/studio_ia/media.py src/studio_ia/pipeline.py src/studio_ia/jobs.py
          python -m mypy src/studio_ia/files.py src/studio_ia/analysis_io.py src/studio_ia/temporal.py src/studio_ia/scene_detect.py src/studio_ia/interpolate.py src/studio_ia/motion.py src/studio_ia/temporal_audio.py src/studio_ia/models.py src/studio_ia/plans_v2.py
      - name: Check the actual Qt X11 plugin before pytest capture
        if: runner.os == 'Linux'
        run: |
          python -c "import pathlib, subprocess, PySide6; subprocess.run(['ldd', str(pathlib.Path(PySide6.__file__).parent / 'Qt/plugins/platforms/libqxcb.so')], check=True)"
          xvfb-run -a python -u -c "from PySide6.QtWidgets import QApplication; app = QApplication([]); print('Qt platform:', app.platformName(), flush=True)"
      - name: Real tests with X11 (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q -ra --junitxml=artifacts/pytest.xml
      - name: Real tests with Windows Qt
        if: runner.os == 'Windows'
        run: python -m pytest -q -ra --junitxml=artifacts/pytest.xml
      - name: M005 real CPU temporal controls (no neural inference)
        run: python scripts/run_temporal_checks.py --output artifacts/temporal
      - name: Mandatory synthetic CPU E2E
        run: python scripts/run_e2e.py --output artifacts/e2e
      - name: Package and test the frozen application (Linux X11)
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/package.py
      - name: Package and test the frozen application (Windows)
        if: runner.os == 'Windows'
        run: python scripts/package.py
      - name: Record installed dependency versions
        if: always()
        run: python -m pip freeze --exclude-editable > artifacts/dependencies.txt
      - name: Verify the delivered archive after extraction (Linux X11)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a python scripts/check_archive.py dist/STUDIO-IA-0.3.0a2-linux-x86_64-ALPHA.zip --output artifacts/extracted-package
      - name: Verify the delivered archive after extraction (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/check_archive.py dist/STUDIO-IA-0.3.0a2-windows-AMD64-ALPHA.zip --output artifacts/extracted-package
      - name: Test the supplied Windows source installer in a Unicode path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $studioInstallRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts/installation source 日本語'
          git archive HEAD --output artifacts/installer-source.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [IO.Compression.ZipFile]::ExtractToDirectory((Join-Path $env:GITHUB_WORKSPACE 'artifacts/installer-source.zip'), $studioInstallRoot)
          & (Join-Path $studioInstallRoot 'Installer-sources.ps1')
          $studioInstalledPython = Join-Path $studioInstallRoot '.venv/Scripts/python.exe'
          & $studioInstalledPython -m studio_ia.cli doctor --json artifacts/installed-source-doctor.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $studioInstalledPython scripts/gui_smoke.py --output artifacts/installed-source-gui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload test evidence (synthetic media only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m003-evidence-${{ runner.os }}-${{ env.STUDIO_IA_SOURCE_SHA }}
          path: |
            artifacts/e2e/
            artifacts/temporal/
            artifacts/temporal-gui/
            artifacts/gui/
            artifacts/frozen-smoke-*/
            artifacts/pytest.xml
            artifacts/dependencies.txt
            artifacts/extracted-package/gui/
            artifacts/extracted-package/temporal/
            artifacts/extracted-package/archive-verification.json
            artifacts/installed-source-doctor.json
            artifacts/installed-source-gui/
          retention-days: 14
      - name: Upload verified experimental package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STUDIO-IA-ALPHA-${{ runner.os }}-${{ env.STUDIO_IA_SOURCE_SHA }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
